<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <style>
        :root {
            --bg: #050505;
            --container: #111;
            --neon-x: #ff0055;
            --neon-o: #00fbff;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Orbitron', sans-serif; /* A futuristic font */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-x);
            margin-bottom: 10px;
        }
        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #888;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 15px;
        }
        .cell {
            background: var(--container);
            border: 2px solid #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .cell:hover {
            border-color: #444;
            background: #1a1a1a;
        }
        .cell.x {
            color: var(--neon-x);
            text-shadow: 0 0 20px var(--neon-x), 0 0 40px var(--neon-x);
        }
        .cell.o {
            color: var(--neon-o);
            text-shadow: 0 0 20px var(--neon-o), 0 0 40px var(--neon-o);
        }
        .reset-btn {
            margin-top: 40px;
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 10px 25px;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .reset-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px white;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <h1>NEON TIC-TAC-TOE</h1>
    <div id="status">PLAYER X TURN</div>

    <div class="grid" id="board">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">System Reset</button>

    <script>
        let turn = 'X';
        let board = ["", "", "", "", "", "", "", "", ""];
        let active = true;
        const statusText = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        const wins = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        function play(idx) {
            if (board[idx] !== "" || !active) return;
            
            board[idx] = turn;
            cells[idx].innerText = turn;
            cells[idx].classList.add(turn.toLowerCase());

            if (checkWin()) {
                statusText.innerText = "PLAYER " + turn + " DOMINATES!";
                statusText.style.color = (turn === 'X' ? 'var(--neon-x)' : 'var(--neon-o)');
                active = false;
                speak("Player " + turn + " wins");
            } else if (!board.includes("")) {
                statusText.innerText = "SYSTEM DRAW";
                active = false;
            } else {
                turn = turn === 'X' ? 'O' : 'X';
                statusText.innerText = "PLAYER " + turn + " TURN";
            }
        }

        function checkWin() {
            return wins.some(comb => {
                return comb.every(i => board[i] === turn);
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            active = true;
            turn = 'X';
            statusText.innerText = "PLAYER X TURN";
            statusText.style.color = "#888";
            cells.forEach(c => {
                c.innerText = "";
                c.classList.remove('x', 'o');
            });
        }

        function speak(m) {
            const s = new SpeechSynthesisUtterance(m);
            window.speechSynthesis.speak(s);
        }
    </script>
</body>
</html>
