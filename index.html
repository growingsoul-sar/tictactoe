<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOD-TIER TIC-TAC-TOE V3</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --accent: #00f2ff;
            --x-color: #ff0055; --o-color: #00ff88; --text: #ffffff;
        }
        .retro-theme {
            --bg: #1a103c; --panel: #2d1b5e; --accent: #f0abfc;
            --x-color: #fb7185; --o-color: #38bdf8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.5s ease;
        }

        #lobby, #game { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #game { display: none; }

        .title { 
            font-family: 'Syncopate', sans-serif; font-size: 2.5rem; letter-spacing: -2px; margin-bottom: 30px; text-align: center;
            background: linear-gradient(90deg, var(--x-color), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card { background: var(--panel); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 12px; color: white; }

        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 700; background: var(--accent); color: #000; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* --- PRO ANIMATIONS --- */
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes winner-glow { 0% { box-shadow: 0 0 10px gold; transform: scale(1); } 50% { box-shadow: 0 0 30px gold; transform: scale(1.05); } 100% { box-shadow: 0 0 10px gold; transform: scale(1); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); } 100% { transform: translate(0, 0); } }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 360px; aspect-ratio: 1; }
        .cell { 
            background: var(--panel); border-radius: 18px; display: flex; align-items: center; justify-content: center; 
            font-size: 4rem; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); 
        }
        .cell.x { color: var(--x-color); text-shadow: 0 0 20px var(--x-color); animation: pop 0.2s ease-out; }
        .cell.o { color: var(--o-color); text-shadow: 0 0 20px var(--o-color); animation: pop 0.2s ease-out; }
        .winner-cell { animation: winner-glow 0.6s infinite !important; border: 2px solid gold !important; z-index: 10; }
        .shake-effect { animation: shake 0.3s; }

        .nav { position: absolute; top: 20px; width: 90%; display: flex; justify-content: space-between; }
        .scoreboard { display: flex; justify-content: space-around; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: #333; }
        .dot.won { background: #ffd700; box-shadow: 0 0 15px #ffd700; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 class="title">NEO MATCH</h1>
        <div class="card">
            <input type="text" id="p1Input" placeholder="ENTER PLAYER NAME">
            <select id="modeInput">
                <option value="ai">VS QUANTUM AI (ADAPTIVE)</option>
                <option value="pvp">VS LOCAL HUMAN</option>
            </select>
            <button class="btn" onclick="initGame()">LAUNCH MATCH</button>
        </div>
    </div>

    <div id="game">
        <div class="nav">
            <button onclick="goHome()" style="background:none; border:none; color:white; cursor:pointer;">🏠 MENU</button>
            <div id="turn-indicator" style="font-weight: bold; color: var(--accent);">P1 TURN</div>
            <button onclick="toggleTheme()" style="background:none; border:none; color:white; cursor:pointer;">🌓 THEME</button>
        </div>

        <div class="scoreboard">
            <div><span id="p1Label">P1</span><div class="dots" id="p1Dots"><div class="dot"></div><div class="dot"></div></div></div>
            <div><span id="p2Label">CPU</span><div class="dots" id="p2Dots"><div class="dot"></div><div class="dot"></div></div></div>
        </div>

        <div class="grid" id="board">
            <div class="cell" onclick="userMove(0)"></div>
            <div class="cell" onclick="userMove(1)"></div>
            <div class="cell" onclick="userMove(2)"></div>
            <div class="cell" onclick="userMove(3)"></div>
            <div class="cell" onclick="userMove(4)"></div>
            <div class="cell" onclick="userMove(5)"></div>
            <div class="cell" onclick="userMove(6)"></div>
            <div class="cell" onclick="userMove(7)"></div>
            <div class="cell" onclick="userMove(8)"></div>
        </div>
        <button class="btn" id="nextBtn" style="display:none; max-width:360px;" onclick="resetRound()">NEXT ROUND</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(f, t) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        let game = { p1Name: localStorage.getItem('ttt-p1') || "", board: Array(9).fill(""), active: true, turn: "X", mode: "ai", p1Wins: 0, p2Wins: 0 };
        if(game.p1Name) document.getElementById('p1Input').value = game.p1Name;
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function initGame() {
            game.p1Name = document.getElementById('p1Input').value.toUpperCase() || "PLAYER 1";
            localStorage.setItem('ttt-p1', game.p1Name);
            game.mode = document.getElementById('modeInput').value;
            document.getElementById('p1Label').innerText = game.p1Name;
            document.getElementById('p2Label').innerText = game.mode === 'ai' ? "QUANTUM AI" : "PLAYER 2";
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
            resetTournament();
        }

        function userMove(i) {
            if (!game.active || game.board[i] !== "") return;
            commitMove(i, game.turn);
            if (game.active && game.mode === 'ai') {
                game.active = false;
                setTimeout(aiMove, 600);
            }
        }

        function commitMove(i, char) {
            game.board[i] = char;
            const cells = document.querySelectorAll('.cell');
            cells[i].innerText = char;
            cells[i].className = `cell ${char.toLowerCase()}`;
            playSound(char === 'X' ? 440 : 554, 'triangle');

            let winPattern = getWinPattern(game.board, char);
            if (winPattern) {
                winPattern.forEach(index => cells[index].classList.add('winner-cell'));
                processRoundEnd(char);
            } else if (!game.board.includes("")) {
                processRoundEnd('draw');
            } else {
                game.turn = game.turn === "X" ? "O" : "X";
                document.getElementById('turn-indicator').innerText = `${game.turn === 'X' ? game.p1Name : (game.mode === 'ai' ? "AI" : "P2")} TURN`;
                game.active = true;
            }
        }

        function aiMove() {
            document.getElementById('board').classList.add('shake-effect');
            setTimeout(() => document.getElementById('board').classList.remove('shake-effect'), 300);
            
            let move;
            if (Math.random() > 0.3) {
                let best = -Infinity;
                for(let i=0; i<9; i++) if(game.board[i]==="") {
                    game.board[i]="O"; let s = minimax(game.board, 0, false); game.board[i]="";
                    if(s > best) { best = s; move = i; }
                }
            } else {
                let avail = game.board.map((v, i) => v===""?i:null).filter(v=>v!==null);
                move = avail[Math.floor(Math.random()*avail.length)];
            }
            commitMove(move, "O");
        }

        function minimax(b, d, m) {
            if(getWinPattern(b, "O")) return 10; if(getWinPattern(b, "X")) return -10; if(!b.includes("")) return 0;
            let scores = [];
            for(let i=0; i<9; i++) if(b[i]==="") {
                b[i] = m ? "O" : "X"; scores.push(minimax(b, d+1, !m)); b[i] = "";
            }
            return m ? Math.max(...scores) : Math.min(...scores);
        }

        function getWinPattern(b, p) { return wins.find(s => s.every(i => b[i] === p)); }

        function processRoundEnd(w) {
            game.active = false;
            if(w === "X") { game.p1Wins++; updateDots('p1Dots', game.p1Wins); }
            else if(w === "O") { game.p2Wins++; updateDots('p2Dots', game.p2Wins); }

            if(game.p1Wins === 2 || game.p2Wins === 2) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('turn-indicator').innerText = "MATCH COMPLETE!";
            } else {
                document.getElementById('nextBtn').style.display = 'block';
            }
        }

        function updateDots(id, wins) {
            const d = document.getElementById(id).children;
            for(let i=0; i<wins; i++) d[i].classList.add('won');
        }

        function resetRound() {
            game.board = Array(9).fill(""); game.active = true; game.turn = "X";
            document.querySelectorAll('.cell').forEach(c => { c.innerText = ""; c.className = "cell"; });
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('turn-indicator').innerText = `${game.p1Name} TURN`;
        }

        function resetTournament() {
            game.p1Wins = 0; game.p2Wins = 0;
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('won'));
            resetRound();
        }

        function goHome() { document.getElementById('game').style.display = 'none'; document.getElementById('lobby').style.display = 'flex'; }
        function toggleTheme() { document.body.classList.toggle('retro-theme'); }
    </script>
</body>
</html>
