<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tic-Tac-Toe</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --x-color: #f43f5e; --o-color: #10b981; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .status { font-size: 1.5rem; margin-bottom: 20px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 15px; background: var(--card); padding: 15px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .cell { width: 100px; height: 100px; background: var(--bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .cell:hover { transform: scale(1.05); background: #1e293b; }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn { margin-top: 40px; padding: 12px 30px; font-size: 1rem; font-weight: bold; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="status" id="status">Player X's Turn</div>

    <div class="grid">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <button class="btn" onclick="reset()">Restart Game</button>

    <script>
        let currentPlayer = 'X';
        let board = ["", "", "", "", "", "", "", "", ""];
        let active = true;

        const statusDisplay = document.getElementById('status');
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8], // Rows
            [0,3,6], [1,4,7], [2,5,8], // Cols
            [0,4,8], [2,4,6]             // Diagonals
        ];

        function announce(msg) {
            statusDisplay.innerText = msg;
            const speech = new SpeechSynthesisUtterance(msg);
            window.speechSynthesis.speak(speech);
        }

        function makeMove(element, index) {
            if (board[index] !== "" || !active) return;

            board[index] = currentPlayer;
            element.innerText = currentPlayer;
            element.classList.add(currentPlayer.toLowerCase());

            if (checkWin()) {
                announce(`Player ${currentPlayer} Wins!`);
                active = false;
                return;
            }

            if (!board.includes("")) {
                announce("It's a Draw!");
                active = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function checkWin() {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === currentPlayer);
            });
        }

        function reset() {
            currentPlayer = "X";
            board = ["", "", "", "", "", "", "", "", ""];
            active = true;
            statusDisplay.innerText = "Player X's Turn";
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o');
            });
            announce("Game Reset");
        }
    </script>
</body>
</html>
