<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>God-Tier Tic-Tac-Toe</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Orbitron:wght@400;900&display=swap');

        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #00f2ff;
            --p1: #ff0055;
            --p2: #00ff88;
            --gold: #ffcc00;
        }

        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Full Screen Hack - No scrolling allowed */
        body { 
            background: var(--bg); color: white; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; 
            height: 100dvh; overflow: hidden; justify-content: space-between;
        }

        /* Lobby & Game States */
        #lobby, #game { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #game { display: none; }

        .neon-text { text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 10px var(--accent); color: var(--accent); }

        /* Tournament Scoreboard */
        .scoreboard {
            display: flex; justify-content: space-around; width: 100%; max-width: 400px;
            background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #333; margin-bottom: 10px;
        }
        .player-info { text-align: center; }
        .rounds { display: flex; gap: 8px; margin-top: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #222; border: 1px solid #444; }
        .dot.won { background: var(--gold); box-shadow: 0 0 10px var(--gold); border: none; }

        /* Grid - Perfect Fit */
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 90vw; max-width: 350px; aspect-ratio: 1/1;
        }
        .cell {
            background: var(--card); border: 1px solid #222; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2rem, 10vw, 4rem); font-weight: 900; cursor: pointer;
        }
        .cell:hover { background: #1a1a1a; border-color: var(--accent); }
        .cell.x { color: var(--p1); text-shadow: 0 0 20px var(--p1); }
        .cell.o { color: var(--p2); text-shadow: 0 0 20px var(--p2); }

        /* UI Elements */
        .input-group { background: var(--card); padding: 25px; border-radius: 25px; border: 1px solid #333; width: 100%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--accent); color: white; border-radius: 10px; text-align: center; }
        .btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900;
            background: var(--accent); color: black; cursor: pointer; text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }

        #badge-container { display: none; margin-top: 10px; animation: glow 2s infinite alternate; }
        @keyframes glow { from { filter: drop-shadow(0 0 5px var(--gold)); } to { filter: drop-shadow(0 0 20px var(--gold)); } }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 class="neon-text">God Tier</h1>
        <div class="input-group">
            <input type="text" id="p1Input" placeholder="YOUR NAME">
            <select id="mode" style="width:100%; padding:12px; margin-bottom:10px; background:#000; color:white; border-radius:10px; border:1px solid var(--accent);">
                <option value="ai">VS QUANTUM AI</option>
                <option value="pvp">VS LOCAL PRO</option>
            </select>
            <button class="btn" onclick="startGame()">Initialize Match</button>
        </div>
    </div>

    <div id="game">
        <div class="scoreboard">
            <div class="player-info">
                <span id="p1Display">P1</span>
                <div class="rounds" id="p1Rounds"><div class="dot"></div><div class="dot"></div></div>
            </div>
            <div style="font-size: 0.7rem; color: #555;">BEST OF 3</div>
            <div class="player-info">
                <span id="p2Display">CPU</span>
                <div class="rounds" id="p2Rounds"><div class="dot"></div><div class="dot"></div></div>
            </div>
        </div>

        <div id="badge-container">🏆 <span id="winner-name"></span> GOT THE GOD BADGE</div>

        <div class="grid" id="board">
            <div class="cell" onclick="handleMove(0)"></div>
            <div class="cell" onclick="handleMove(1)"></div>
            <div class="cell" onclick="handleMove(2)"></div>
            <div class="cell" onclick="handleMove(3)"></div>
            <div class="cell" onclick="handleMove(4)"></div>
            <div class="cell" onclick="handleMove(5)"></div>
            <div class="cell" onclick="handleMove(6)"></div>
            <div class="cell" onclick="handleMove(7)"></div>
            <div class="cell" onclick="handleMove(8)"></div>
        </div>

        <div style="margin-top: 20px; width: 100%; max-width: 350px;">
            <button class="btn" id="nextRoundBtn" style="display:none;" onclick="nextRound()">Next Round</button>
            <button class="btn" id="resetBtn" style="display:none; background: #555;" onclick="location.reload()">Reset Tournament</button>
        </div>
    </div>

    <script>
        let state = {
            p1Name: "", p2Name: "Quantum AI",
            p1Wins: 0, p2Wins: 0,
            board: Array(9).fill(""),
            active: true, turn: "X",
            mode: "ai"
        };

        const winCombos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function startGame() {
            state.p1Name = document.getElementById('p1Input').value || "Alpha";
            state.mode = document.getElementById('mode').value;
            if(state.mode === 'pvp') state.p2Name = "Sigma Player";
            
            document.getElementById('p1Display').innerText = state.p1Name;
            document.getElementById('p2Display').innerText = state.p2Name;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
        }

        function handleMove(i) {
            if(!state.active || state.board[i] !== "") return;
            executeMove(i, "X");
            if(state.active && state.mode === 'ai') {
                state.active = false;
                setTimeout(aiLogic, 400);
            }
        }

        function executeMove(i, char) {
            state.board[i] = char;
            const cells = document.querySelectorAll('.cell');
            cells[i].innerText = char;
            cells[i].classList.add(char.toLowerCase());
            
            if(checkWin(state.board, char)) {
                endRound(char);
            } else if(!state.board.includes("")) {
                endRound("draw");
            } else {
                state.turn = char === "X" ? "O" : "X";
                state.active = true;
            }
        }

        function aiLogic() {
            let bestScore = -Infinity;
            let move;
            for(let i=0; i<9; i++) {
                if(state.board[i] === "") {
                    state.board[i] = "O";
                    let score = minimax(state.board, 0, false);
                    state.board[i] = "";
                    if(score > bestScore) { bestScore = score; move = i; }
                }
            }
            executeMove(move, "O");
        }

        function minimax(b, depth, isMax) {
            if(checkWin(b, "O")) return 10;
            if(checkWin(b, "X")) return -10;
            if(!b.includes("")) return 0;
            
            let scores = [];
            for(let i=0; i<9; i++) {
                if(b[i] === "") {
                    b[i] = isMax ? "O" : "X";
                    scores.push(minimax(b, depth+1, !isMax));
                    b[i] = "";
                }
            }
            return isMax ? Math.max(...scores) : Math.min(...scores);
        }

        function checkWin(b, p) { return winCombos.some(s => s.every(i => b[i] === p)); }

        function endRound(winner) {
            state.active = false;
            if(winner === "X") {
                state.p1Wins++;
                updateDots('p1Rounds', state.p1Wins);
            } else if(winner === "O") {
                state.p2Wins++;
                updateDots('p2Rounds', state.p2Wins);
            }

            if(state.p1Wins === 2 || state.p2Wins === 2) {
                const finalWinner = state.p1Wins === 2 ? state.p1Name : state.p2Name;
                document.getElementById('badge-container').style.display = 'block';
                document.getElementById('winner-name').innerText = finalWinner;
                document.getElementById('resetBtn').style.display = 'block';
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                document.getElementById('nextRoundBtn').style.display = 'block';
            }
        }

        function updateDots(id, wins) {
            const dots = document.getElementById(id).children;
            for(let i=0; i<wins; i++) dots[i].classList.add('won');
        }

        function nextRound() {
            state.board = Array(9).fill("");
            state.active = true;
            state.turn = "X";
            document.querySelectorAll('.cell').forEach(c => { c.innerText = ""; c.className = 'cell'; });
            document.getElementById('nextRoundBtn').style.display = 'none';
        }
    </script>
</body>
</html>
