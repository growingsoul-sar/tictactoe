<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO MATCH ULTRA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --accent: #00f2ff;
            --x-color: #ff0055; --o-color: #00ff88; --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }
        .theme-matrix { --bg: #000; --panel: #0a110a; --accent: #00ff41; --x-color: #008f11; --o-color: #d1ffd7; }
        .theme-vapor { --bg: #2d1b5e; --panel: #4c1d95; --accent: #f0abfc; --x-color: #fb7185; --o-color: #38bdf8; }
        .theme-gold { --bg: #111; --panel: #1f1f1f; --accent: #fbbf24; --x-color: #fff; --o-color: #f59e0b; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); margin: 0; 
            font-family: 'Space Grotesk', sans-serif; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
            transition: 0.4s;
        }

        .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #game { display: none; }

        .title { 
            font-family: 'Syncopate', sans-serif; font-size: 2.2rem; letter-spacing: -1px; margin-bottom: 20px; text-align: center;
            background: linear-gradient(90deg, var(--x-color), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card { background: var(--panel); padding: 25px; border-radius: 24px; width: 100%; max-width: 380px; border: 1px solid var(--glass); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 12px; color: white; }

        .btn { 
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700; 
            background: var(--accent); color: #000; cursor: pointer; text-transform: uppercase; margin-top: 8px;
        }
        .btn-share { background: #5865F2; color: white; margin-top: 15px; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 15px 0; }
        .cell { 
            background: var(--panel); border-radius: 15px; display: flex; align-items: center; justify-content: center; 
            font-size: 3rem; font-weight: 700; cursor: pointer; border: 1px solid var(--glass); transition: 0.2s;
        }
        .cell.x { color: var(--x-color); text-shadow: 0 0 15px var(--x-color); animation: pop 0.3s forwards; }
        .cell.o { color: var(--o-color); text-shadow: 0 0 15px var(--o-color); animation: pop 0.3s forwards; }
        
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        .winner-cell { background: var(--accent) !important; color: #000 !important; }

        .scoreboard { display: flex; justify-content: space-between; width: 100%; max-width: 340px; padding: 12px; background: var(--glass); border-radius: 15px; margin-bottom: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; margin: 2px; display: inline-block; }
        .dot.won { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

        #congrats-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center;
        }
    </style>
</head>
<body>

    <div id="lobby" class="screen">
        <h1 class="title">NEO MATCH</h1>
        <div class="card">
            <input type="text" id="p1Input" placeholder="YOUR NAME">
            <select id="modeInput">
                <option value="ai">VS QUANTUM AI</option>
                <option value="pvp">LOCAL BATTLE (PVP)</option>
            </select>
            <select id="themeInput" onchange="applyTheme(this.value)">
                <option value="default">CYBER NEON</option>
                <option value="matrix">THE MATRIX</option>
                <option value="vapor">VAPORWAVE</option>
                <option value="gold">LUX GOLD</option>
            </select>
            <button class="btn" onclick="initGame()">LAUNCH MATCH</button>
            <p style="text-align:center; opacity:0.6; margin-top:10px;">WORLD STREAK: <span id="highScore">0</span></p>
        </div>
    </div>

    <div id="game" class="screen">
        <div style="width:100%; max-width:340px; display:flex; justify-content:space-between; margin-bottom:10px;">
            <button onclick="goHome()" style="color:white; background:none; border:none;">[MENU]</button>
            <div id="status" style="color:var(--accent); font-weight:bold;">X TURN</div>
            <button onclick="resetRound()" style="color:white; background:none; border:none;">[RESTART]</button>
        </div>

        <div class="scoreboard">
            <div><span id="p1Label">P1</span> <div id="p1Dots"></div></div>
            <div style="text-align:right"><span id="p2Label">P2</span> <div id="p2Dots"></div></div>
        </div>

        <div class="grid" id="board"></div>
        <button id="nextBtn" class="btn" style="display:none; max-width:340px;" onclick="resetRound()">NEXT ROUND</button>
    </div>

    <div id="congrats-overlay">
        <h2 id="winner-msg" class="title">VICTORY!</h2>
        <p id="winner-sub" style="margin-bottom:20px;"></p>
        <div style="width:80%; max-width:300px;">
            <button class="btn" onclick="resetTournament()">REMATCH</button>
            <button class="btn btn-share" onclick="shareScore()">CHALLENGE FRIENDS</button>
            <button class="btn btn-outline" onclick="goHome()" style="background:none; color:white; border:1px solid white; margin-top:10px;">EXIT</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNote(freq, type="sine", dur=0.1) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function playWinMusic() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playNote(f, "triangle", 0.5), i * 150)); }
        function playLoseMusic() { [300, 250, 200].forEach((f, i) => setTimeout(() => playNote(f, "sawtooth", 0.6), i * 200)); }

        let state = {
            board: Array(9).fill(""), turn: "X", active: true, mode: "ai",
            p1Wins: 0, p2Wins: 0, p1Name: "PLAYER 1"
        };

        function applyTheme(t) { document.body.className = t === 'default' ? '' : 'theme-' + t; }

        function initGame() {
            state.p1Name = document.getElementById('p1Input').value.toUpperCase() || "PLAYER";
            state.mode = document.getElementById('modeInput').value;
            document.getElementById('p1Label').innerText = state.p1Name;
            document.getElementById('p2Label').innerText = state.mode === 'ai' ? "QUANTUM AI" : "PLAYER 2";
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
            
            // Generate dots
            document.getElementById('p1Dots').innerHTML = '<div class="dot"></div><div class="dot"></div>';
            document.getElementById('p2Dots').innerHTML = '<div class="dot"></div><div class="dot"></div>';
            
            resetTournament();
        }

        function handleMove(i) {
            if (!state.active || state.board[i] !== "") return;
            
            makeMove(i, state.turn);

            if (state.active && state.mode === "ai" && state.turn === "O") {
                state.active = false;
                setTimeout(aiLogic, 600);
            }
        }

        function makeMove(i, char) {
            state.board[i] = char;
            const cells = document.querySelectorAll('.cell');
            cells[i].innerText = char;
            cells[i].classList.add(char.toLowerCase());
            playNote(char === "X" ? 400 : 300);

            const win = checkWin(state.board, char);
            if (win) {
                win.forEach(idx => cells[idx].classList.add('winner-cell'));
                endRound(char);
            } else if (!state.board.includes("")) {
                endRound("draw");
            } else {
                state.turn = state.turn === "X" ? "O" : "X";
                document.getElementById('status').innerText = (state.turn === "X" ? state.p1Name : (state.mode === 'ai' ? "AI" : "P2")) + " TURN";
                state.active = true;
            }
        }

        function aiLogic() {
            let bestScore = -Infinity, move;
            for (let i = 0; i < 9; i++) {
                if (state.board[i] === "") {
                    state.board[i] = "O";
                    let score = minimax(state.board, 0, false);
                    state.board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            makeMove(move, "O");
        }

        function minimax(board, depth, isMax) {
            if (checkWin(board, "O")) return 10;
            if (checkWin(board, "X")) return -10;
            if (!board.includes("")) return 0;
            if (isMax) {
                let best = -Infinity;
                for(let i=0; i<9; i++) if(board[i]==="") {
                    board[i]="O"; best = Math.max(best, minimax(board, depth+1, false)); board[i]="";
                }
                return best;
            } else {
                let best = Infinity;
                for(let i=0; i<9; i++) if(board[i]==="") {
                    board[i]="X"; best = Math.min(best, minimax(board, depth+1, true)); board[i]="";
                }
                return best;
            }
        }

        function checkWin(b, p) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return lines.find(l => l.every(i => b[i] === p));
        }

        function endRound(winner) {
            state.active = false;
            if (winner === "X") { state.p1Wins++; updateDots('p1Dots', state.p1Wins); }
            if (winner === "O") { state.p2Wins++; updateDots('p2Dots', state.p2Wins); }

            if (state.p1Wins === 2 || state.p2Wins === 2) {
                const finalWinner = state.p1Wins === 2 ? state.p1Name : (state.mode === 'ai' ? "AI" : "PLAYER 2");
                if (state.p1Wins === 2) { playWinMusic(); confetti(); } else { playLoseMusic(); }
                document.getElementById('winner-sub').innerText = finalWinner + " IS THE SUPREME CHAMPION";
                document.getElementById('congrats-overlay').style.display = 'flex';
            } else {
                document.getElementById('nextBtn').style.display = 'block';
            }
        }

        function updateDots(id, count) {
            const dots = document.getElementById(id).children;
            for(let i=0; i<count; i++) dots[i].classList.add('won');
        }

        function resetRound() {
            state.board = Array(9).fill("");
            state.active = true;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('board').innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => handleMove(i);
                document.getElementById('board').appendChild(c);
            }
            // RANDOM START LOGIC
            state.turn = Math.random() > 0.5 ? "X" : "O";
            document.getElementById('status').innerText = (state.turn === "X" ? state.p1Name : "O") + " STARTS";
            if(state.mode === 'ai' && state.turn === "O") { state.active = false; setTimeout(aiLogic, 600); }
        }

        function resetTournament() {
            state.p1Wins = 0; state.p2Wins = 0;
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('won'));
            document.getElementById('congrats-overlay').style.display = 'none';
            resetRound();
        }

        function shareScore() {
            if (navigator.share) {
                navigator.share({
                    title: 'NEO MATCH CHALLENGE',
                    text: `I just dominated Neo Match! Can you beat my streak?`,
                    url: window.location.href
                });
            } else { alert("Sharing not supported on this browser - copy the link!"); }
        }

        function goHome() {
            document.getElementById('game').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';
            document.getElementById('congrats-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
