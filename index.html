<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO MATCH PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --accent: #00f2ff;
            --x-color: #ff0055; --o-color: #00ff88; --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }
        /* THEMES */
        .theme-matrix { --bg: #000; --panel: #0a110a; --accent: #00ff41; --x-color: #008f11; --o-color: #d1ffd7; }
        .theme-vapor { --bg: #2d1b5e; --panel: #4c1d95; --accent: #f0abfc; --x-color: #fb7185; --o-color: #38bdf8; }
        .theme-gold { --bg: #111; --panel: #1f1f1f; --accent: #fbbf24; --x-color: #fff; --o-color: #f59e0b; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            font-family: 'Space Grotesk', sans-serif; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* LOBBY & SCREENS */
        .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: 0.5s; }
        #game { display: none; }

        .title { 
            font-family: 'Syncopate', sans-serif; font-size: 2.5rem; letter-spacing: -2px; margin-bottom: 30px; text-align: center;
            background: linear-gradient(90deg, var(--x-color), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.3));
        }

        .card { background: var(--panel); padding: 30px; border-radius: 28px; width: 100%; max-width: 400px; border: 1px solid var(--glass); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        input, select { width: 100%; padding: 16px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 14px; color: white; font-size: 1rem; }

        .btn { 
            width: 100%; padding: 18px; border-radius: 14px; border: none; font-weight: 700; 
            background: var(--accent); color: #000; cursor: pointer; text-transform: uppercase; 
            margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,242,255,0.2);
        }
        .btn:active { transform: scale(0.96); }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        /* GAME ELEMENTS */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 20px 0; }
        .cell { 
            background: var(--panel); border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            font-size: 3.5rem; font-weight: 700; cursor: pointer; border: 1px solid var(--glass);
            transition: 0.2s; position: relative;
        }
        .cell:hover { background: rgba(255,255,255,0.03); }
        
        /* ANIMATIONS */
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes winPulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .cell.x { color: var(--x-color); text-shadow: 0 0 20px var(--x-color); animation: pop 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .cell.o { color: var(--o-color); text-shadow: 0 0 20px var(--o-color); animation: pop 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .winner-cell { animation: winPulse 0.5s infinite; background: var(--accent) !important; color: #000 !important; text-shadow: none !important; z-index: 5; }

        /* SCORE & NAV */
        .nav { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .scoreboard { display: flex; justify-content: space-between; width: 100%; max-width: 400px; padding: 15px; background: var(--glass); border-radius: 18px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; margin: 2px; transition: 0.3s; }
        .dot.won { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* CONGRATS MODAL */
        #congrats-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            backdrop-filter: blur(10px); text-align: center;
        }
    </style>
</head>
<body>

    <div id="lobby" class="screen">
        <h1 class="title">NEO MATCH</h1>
        <div class="card">
            <input type="text" id="p1Input" placeholder="YOUR NAME">
            <select id="modeInput">
                <option value="ai">VS QUANTUM AI</option>
                <option value="pvp">LOCAL HUMAN</option>
            </select>
            <select id="themeInput" onchange="applyTheme(this.value)">
                <option value="default">CYBER NEON</option>
                <option value="matrix">THE MATRIX</option>
                <option value="vapor">VAPORWAVE</option>
                <option value="gold">LUX GOLD</option>
            </select>
            <button class="btn" onclick="initGame()">START MATCH</button>
            <p style="text-align:center; font-size:0.8rem; opacity:0.6; margin-top:15px;">TOP STREAK: <span id="highScore">0</span></p>
        </div>
    </div>

    <div id="game" class="screen">
        <div class="nav">
            <button onclick="goHome()" style="background:none; border:none; color:white; font-weight:bold;">🏠 MENU</button>
            <div id="turn-indicator" style="color: var(--accent); font-weight:bold;">YOUR TURN</div>
            <button onclick="resetRound()" style="background:none; border:none; color:white; font-weight:bold;">🔄 RESTART</button>
        </div>

        <div class="scoreboard">
            <div><span id="p1Label">P1</span><div style="display:flex" id="p1Dots"><div class="dot"></div><div class="dot"></div></div></div>
            <div style="text-align:right"><span id="p2Label">CPU</span><div style="display:flex" id="p2Dots"><div class="dot"></div><div class="dot"></div></div></div>
        </div>

        <div class="grid" id="board">
            </div>

        <button id="nextRoundBtn" class="btn" style="display:none; max-width:360px;" onclick="resetRound()">NEXT ROUND</button>
    </div>

    <div id="congrats-overlay">
        <h2 id="winner-msg" class="title" style="font-size: 3rem;">WINNER!</h2>
        <p id="winner-name" style="font-size: 1.5rem; margin-bottom: 30px;"></p>
        <div style="width: 80%; max-width: 300px;">
            <button class="btn" onclick="resetTournament()">PLAY AGAIN</button>
            <button class="btn btn-outline" onclick="goHome()">BACK TO MENU</button>
        </div>
    </div>

    <script>
        // PWA REGISTRATION
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log(err)); });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq) {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.frequency.setValueAtTime(freq, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        let state = {
            p1Name: localStorage.getItem('ttt-name') || "PLAYER 1",
            board: Array(9).fill(""),
            turn: "X", active: true, mode: "ai",
            p1Wins: 0, p2Wins: 0, streak: 0
        };

        document.getElementById('p1Input').value = state.p1Name;
        document.getElementById('highScore').innerText = localStorage.getItem('ttt-streak') || 0;

        function applyTheme(theme) {
            document.body.className = theme === 'default' ? '' : 'theme-' + theme;
        }

        function initGame() {
            state.p1Name = document.getElementById('p1Input').value.toUpperCase() || "PLAYER 1";
            localStorage.setItem('ttt-name', state.p1Name);
            state.mode = document.getElementById('modeInput').value;
            document.getElementById('p1Label').innerText = state.p1Name;
            document.getElementById('p2Label').innerText = state.mode === 'ai' ? "QUANTUM AI" : "PLAYER 2";
            
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
            renderBoard();
            resetTournament();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for(let i=0; i<9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => handleMove(i);
                boardEl.appendChild(cell);
            }
        }

        function handleMove(i) {
            if (!state.active || state.board[i] !== "") return;
            makeMove(i, "X");
            if (state.active && state.mode === "ai") {
                state.active = false;
                setTimeout(aiLogic, 600);
            }
        }

        function makeMove(i, char) {
            state.board[i] = char;
            const cells = document.querySelectorAll('.cell');
            cells[i].innerText = char;
            cells[i].classList.add(char.toLowerCase());
            playSfx(char === "X" ? 440 : 523);

            let win = checkWin(state.board, char);
            if (win) {
                win.forEach(idx => cells[idx].classList.add('winner-cell'));
                endRound(char);
            } else if (!state.board.includes("")) {
                endRound("draw");
            } else {
                state.turn = state.turn === "X" ? "O" : "X";
                updateTurnIndicator();
                state.active = true;
            }
        }

        function aiLogic() {
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (state.board[i] === "") {
                    state.board[i] = "O";
                    let score = minimax(state.board, 0, false);
                    state.board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            makeMove(move, "O");
        }

        function minimax(board, depth, isMaximizing) {
            if (checkWin(board, "O")) return 10;
            if (checkWin(board, "X")) return -10;
            if (!board.includes("")) return 0;

            if (isMaximizing) {
                let best = -Infinity;
                for(let i=0; i<9; i++) if(board[i]==="") {
                    board[i]="O"; best = Math.max(best, minimax(board, depth+1, false)); board[i]="";
                }
                return best;
            } else {
                let best = Infinity;
                for(let i=0; i<9; i++) if(board[i]==="") {
                    board[i]="X"; best = Math.min(best, minimax(board, depth+1, true)); board[i]="";
                }
                return best;
            }
        }

        function checkWin(b, p) {
            const combos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return combos.find(c => c.every(i => b[i] === p));
        }

        function endRound(winner) {
            state.active = false;
            if (winner === "X") { state.p1Wins++; updateScoreDots('p1Dots', state.p1Wins); }
            if (winner === "O") { state.p2Wins++; updateScoreDots('p2Dots', state.p2Wins); }

            if (state.p1Wins === 2 || state.p2Wins === 2) {
                showCongrats(winner === "X" ? state.p1Name : (state.mode === 'ai' ? "QUANTUM AI" : "PLAYER 2"));
            } else {
                document.getElementById('nextRoundBtn').style.display = 'block';
            }
        }

        function showCongrats(name) {
            document.getElementById('winner-name').innerText = name + " DESTROYED THE MATCH!";
            document.getElementById('congrats-overlay').style.display = 'flex';
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
            
            // Local Leaderboard logic
            if(name === state.p1Name) {
                let high = localStorage.getItem('ttt-streak') || 0;
                high++;
                localStorage.setItem('ttt-streak', high);
                document.getElementById('highScore').innerText = high;
            }
        }

        function updateScoreDots(id, count) {
            const dots = document.getElementById(id).children;
            for(let i=0; i<count; i++) dots[i].classList.add('won');
        }

        function resetRound() {
            state.board = Array(9).fill("");
            state.turn = "X";
            state.active = true;
            document.getElementById('nextRoundBtn').style.display = 'none';
            document.getElementById('congrats-overlay').style.display = 'none';
            renderBoard();
            updateTurnIndicator();
        }

        function resetTournament() {
            state.p1Wins = 0; state.p2Wins = 0;
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('won'));
            resetRound();
        }

        function updateTurnIndicator() {
            const name = state.turn === "X" ? state.p1Name : (state.mode === 'ai' ? "AI" : "P2");
            document.getElementById('turn-indicator').innerText = name + "'S TURN";
        }

        function goHome() {
            document.getElementById('game').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';
            document.getElementById('congrats-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
